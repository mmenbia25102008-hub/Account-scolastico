<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifica account scolastico</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.card {
  background: white;
  width: 90%;
  max-width: 430px;
  padding: 32px;
  border-radius: 14px;
  box-shadow: 0 4px 20px #0002;
  text-align: center;
}
.logo { font-size: 42px; }
h2 { color: #263b60; }
button {
  background: #2764b5;
  color: white;
  border: 0;
  padding: 14px 22px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 16px;
}
.notice {
  display: none;
  background: #e8f5ed;
  padding: 18px;
  border-radius: 9px;
  color: #175b32;
  margin-top: 20px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🏫</div>
  <h2>Verifica account scolastico</h2>
  <p>Questa verifica del registro elettronico.</p>
  <button onclick="showNotice()">Continua</button>
  <div class="notice" id="notice">
    <h3>⚠️ Verifica account scolastico</h3>
    <p>Prima di cliccare su un link ricevuto via email, controlla sempre il mittente e l'indirizzo del sito.</p>
  </div>
</div>
<script>
function showNotice() {
  document.getElementById("notice").style.display = "block";
}
</script>
</body>
</html>
